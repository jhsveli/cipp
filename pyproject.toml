[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "cipp"
# From git (hatch-vcs): every commit on main is a newer version, so
# `pipx upgrade cipp` picks it up.
dynamic = ["version"]
description = "Textual TUI for reviewing and merging GitHub PRs across two tabs (production rollouts and review queue)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual>=0.50"]

[project.scripts]
cipp = "cipp.menu:main"

[tool.hatch.version]
source = "vcs"
