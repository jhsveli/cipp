[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cipp"
version = "0.1.0"
description = "Textual TUI for reviewing and merging GitHub PRs across two tabs (production rollouts and review queue)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual>=0.50"]

[project.scripts]
cipp = "cipp.menu:main"
